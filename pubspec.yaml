name: lsp_digital_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.1-beta.116+143

environment:
  sdk: ^3.11.1

dependencies:
  dio: ^5.9.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_lucide: ^1.34.0
  januscaler_flutter_ringtone_player: ^1.0.2
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  intl: 0.20.3
  syncfusion_flutter_maps: ^34.2.5
  file_picker: ^12.1.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0

  material_ui: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
